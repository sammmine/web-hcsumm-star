[project]
name = "hcsumm-web"
version = "0.1.0"
description = "Web backend wrapping the HCSumm* call-graph summarization pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "python-multipart>=0.0.18",
    "networkx>=3.3",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "gensim>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hcsumm", "app"]
